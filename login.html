        @keyframes slideIn {

            }

        .spinner {
            animation: rotate 1s linear infinite;

        @keyframes rotate {

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import {
            getAuth, signInWithEmailAndPassword, sendPasswordResetEmail,
            onAuthStateChanged, signOut
        } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, query, where, orderBy, getDocs, addDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDKDT0kvwEm0cEdh_MpbTb8A9W3_xwAVxY",
            authDomain: "dsu-exam-system.firebaseapp.com",
            projectId: "dsu-exam-system",
            storageBucket: "dsu-exam-system.firebasestorage.app",
            messagingSenderId: "155083834622",
            appId: "1:155083834622:web:ff0a9780b88bad0b8811af",
            measurementId: "G-1TPT1BR6GD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ============================================================
        // BOOTSTRAP SUPER-ADMIN EMAIL LIST
        // ============================================================
        const ADMIN_EMAILS = ['admin@dsu.edu', 'loganathan@dsu.edu', 'mloganathan082008@gmail.com', 'exampro.loganathanm.in@gmail.com'];

        // Do not auto-redirect on page load — allow user to manually choose role & enter credentials
        onAuthStateChanged(auth, (user) => {
            const loginContent = document.getElementById('loginContent');
            if (loginContent) {
                loginContent.style.opacity = '1';
                loginContent.style.pointerEvents = 'auto';
            }
        });

        let userType = 'student';

        // DEV-ONLY: log which path resolved isAdmin (never runs on production)
        const IS_DEV = location.hostname === 'localhost' || location.hostname === '127.0.0.1';

        window.toggleUserType = (type) => {
            userType = type;
            const adminCodeGroup = document.getElementById('adminCodeGroup');
            const usernameLabel = document.getElementById('usernameLabel');
            const emailInput = document.getElementById('email');
            const adminCodeInput = document.getElementById('adminCode');

            if (type === 'admin') {
                adminCodeGroup.style.display = 'block';
                if (adminCodeInput) adminCodeInput.required = true;
                if (usernameLabel) usernameLabel.innerHTML = 'Staff / Admin Email <span>*</span>';
                if (emailInput) emailInput.placeholder = 'admin@dsu.edu / staff email';
            } else {
                adminCodeGroup.style.display = 'none';
                if (adminCodeInput) {
                    adminCodeInput.required = false;
                    adminCodeInput.value = '';
                }
                if (usernameLabel) usernameLabel.innerHTML = 'Username / USN / Reg No <span>*</span>';
                if (emailInput) emailInput.placeholder = 'Email / Register No. / Mobile No.';
            }
        };

        window.togglePasswordVisibility = () => {
            const passInput = document.getElementById('password');
            const checkbox = document.getElementById('showPassCheckbox');
            passInput.type = checkbox.checked ? 'text' : 'password';
        };

        window.handleLogin = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const adminCodeInput = document.getElementById('adminCode');
            const adminCode = adminCodeInput ? adminCodeInput.value.trim() : '';
            const btn = document.getElementById('loginBtn');

            if (userType === 'admin') {
                if (!adminCode) {
                    showToast('Please enter Admin Security Code!', 'error');
                    return;
                }
                if (adminCode !== '2026') {
                    showToast('Invalid Admin Security Code! Access Denied.', 'error');
                    return;
                }
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            let finalEmail = email;
            try {
                let foundAccounts = [];
                // If input doesn't look like an email, try resolving it as Register Number or Phone
                if (!finalEmail.includes('@')) {
                    if (userType === 'admin') {
                        showToast('Staff/Admin login requires full email address.', 'error');
                        resetBtn();
                        return;
                    }

                    const studentsRef = collection(db, 'students');

                    let q = query(studentsRef, where('registerNumber', '==', finalEmail));
                    let snap = await getDocs(q);

                    if (snap.empty) {
                        q = query(studentsRef, where('registerNumber', '==', finalEmail.toUpperCase()));
                        snap = await getDocs(q);
                    }
                    if (snap.empty) {
                        q = query(studentsRef, where('registerNumber', '==', finalEmail.toLowerCase()));
                        snap = await getDocs(q);
                    }

                    if (!snap.empty) {
                        snap.forEach(doc => foundAccounts.push(doc.data().email.trim()));
                    } else {
                        q = query(studentsRef, where('phone', '==', finalEmail));
                        snap = await getDocs(q);
                        if (!snap.empty) {
                            snap.forEach(doc => foundAccounts.push(doc.data().email.trim()));
                        } else {
                            showToast('Account not found with this Register/Mobile Number.', 'error');
                            resetBtn();
                            return;
                        }
                    }
                } else {
                    foundAccounts.push(finalEmail.trim());
                }

                let cred = null;
                let loggedIn = false;
                let lastErr = null;

                for (let accEmail of foundAccounts) {
                    try {
                        cred = await signInWithEmailAndPassword(auth, accEmail, password);
                        loggedIn = true;
                        finalEmail = accEmail;
                        break;
                    } catch (err) {
                        lastErr = err;
                    }
                }

                if (!loggedIn) {
                    throw lastErr;
                }

                // ============================================================
                // Strict Role Validation
                // Priority: admins/{uid} Firestore doc → ADMIN_EMAILS fallback
                // ============================================================
                let isAdminData = null;
                let isSuperAdmin = ADMIN_EMAILS.includes(finalEmail.toLowerCase());
                try {
                    const adminDoc = await getDoc(doc(db, 'admins', cred.user.uid));
                    if (adminDoc.exists()) {
                        isAdminData = adminDoc.data();
                    }
                } catch (adminDocErr) {
                    if (IS_DEV) console.warn('[DEV] admins doc fetch failed:', adminDocErr.message);
                }

                const isAdmin = (isAdminData !== null) || isSuperAdmin;

                // 1. If Staff/Admin Role selected, but account is NOT Admin
                if (userType === 'admin' && !isAdmin) {
                    await signOut(auth);
                    showToast('❌ Student account detected! Please select "Student" role to login.', 'error');
                    resetBtn();
                    return;
                }

                // 2. If Student Role selected, but account IS Admin
                if (userType === 'student' && isAdmin) {
                    await signOut(auth);
                    showToast('⚠️ Admin / Staff account detected! Please select "Role Staff" to login.', 'error');
                    resetBtn();
                    return;
                }

                // 3. For Students: Check Approval Status
                const userDoc = await getDoc(doc(db, 'students', cred.user.uid));
                const userData = userDoc.exists() ? userDoc.data() : {};

                if (userType === 'student') {
                    const approvalStatus = userData.approvalStatus || 'approved';
                    if (approvalStatus === 'pending') {
                        await signOut(auth);
                        showToast('⏳ Registration approval pending from Admin. Please wait.', 'info');
                        resetBtn();
                        return;
                    }
                    if (approvalStatus === 'rejected') {
                        await signOut(auth);
                        showToast('❌ Registration rejected by Admin. Please contact university admin.', 'error');
                        resetBtn();
                        return;
                    }
                    if (approvalStatus === 'blocked') {
                        await signOut(auth);
                        showToast('🚫 Account blocked for security violation. Contact admin at support.loga@gmail.com.', 'error');
                        resetBtn();
                        return;
                    }
                }

                // Log Activity History
                function getDeviceLabel() {
                    const ua = navigator.userAgent;
                    let browser = "Unknown Browser";
                    if (ua.includes("Firefox")) browser = "Firefox";
                    else if (ua.includes("SamsungBrowser")) browser = "Samsung Internet";
                    else if (ua.includes("Opera") || ua.includes("OPR")) browser = "Opera";
                    else if (ua.includes("Edge")) browser = "Edge";
                    else if (ua.includes("Chrome")) browser = "Chrome";
                    else if (ua.includes("Safari")) browser = "Safari";
                    let os = "Unknown OS";
                    if (ua.includes("Win")) os = "Windows";
                    else if (ua.includes("Mac")) os = "Mac";
                    else if (ua.includes("Linux")) os = "Linux";
                    else if (ua.includes("Android")) os = "Android";
                    else if (ua.includes("like Mac")) os = "iOS";
                    return `${browser} on ${os}`;
                }

                try {
                    const historyRef = collection(db, 'students', cred.user.uid, 'loginHistory');
                    await addDoc(historyRef, {
                        timestamp: serverTimestamp(),
                        userAgent: navigator.userAgent,
                        approxDevice: getDeviceLabel(),
                        loginRole: userType
                    });
                    const hq = query(historyRef, orderBy('timestamp', 'desc'));
                    const historyDocs = await getDocs(hq);
                    if (historyDocs.size > 10) {
                        const toDelete = historyDocs.docs.slice(10);
                        for (let d of toDelete) {
                            await deleteDoc(d.ref);
                        }
                    }
                } catch (e) {
                    console.error("Failed to log activity", e);
                }

                // OTP Logic for 2FA or Admins
                if (isAdmin || userData.twoFactorEnabled === true) {
                    const otp = Math.floor(100000 + Math.random() * 900000).toString();
                    const expiresAt = new Date(Date.now() + 5 * 60000); // 5 mins

                    await setDoc(doc(db, 'otpVerifications', cred.user.uid), {
                        code: otp,
                        expiresAt: expiresAt,
                        verified: false
                    });

                    // EmailJS Send
                    const serviceID = 'service_loga';
                    const templateID = 'template_loga';
                    const publicKey = 'dNb9eBTjrfv99xMqm';

                    if (serviceID.startsWith('YOUR_') || templateID.startsWith('YOUR_') || publicKey.startsWith('YOUR_')) {
                        console.warn('EmailJS not configured — showing OTP on screen for testing');
                        showToast('DEV MODE — Your OTP: ' + otp, 'success');
                    } else {
                        try {
                            await fetch('https://api.emailjs.com/api/v1.0/email/send', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    service_id: serviceID,
                                    template_id: templateID,
                                    user_id: publicKey,
                                    template_params: {
                                        to_email: finalEmail,
                                        passcode: otp,
                                        time: '5 minutes'
                                    }
                                })
                            });
                            showToast('OTP sent to ' + finalEmail, 'success');
                        } catch (e) {
                            console.error('EmailJS Error', e);
                            showToast('OTP verification code: ' + otp, 'info');
                        }
                    }

                    document.getElementById('otpModal').style.display = 'flex';

                    document.getElementById('verifyOtpBtn').onclick = async () => {
                        const entered = document.getElementById('otpInput').value.trim();
                        const errEl = document.getElementById('otpError');
                        if (entered.length !== 6) {
                            errEl.textContent = 'Enter 6-digit code';
                            errEl.style.display = 'block';
                            return;
                        }

                        const otpDocRef = doc(db, 'otpVerifications', cred.user.uid);
                        const otpSnap = await getDoc(otpDocRef);

                        if (!otpSnap.exists()) {
                            errEl.textContent = 'OTP session not found';
                            errEl.style.display = 'block';
                            return;
                        }

                        const data = otpSnap.data();
                        if (data.expiresAt.toDate() < new Date()) {
                            errEl.textContent = 'OTP expired. Please login again.';
                            errEl.style.display = 'block';
                            return;
                        }

                        if (data.code !== entered) {
                            errEl.textContent = 'Incorrect OTP';
                            errEl.style.display = 'block';
                            return;
                        }

                        await setDoc(otpDocRef, { verified: true }, { merge: true });
                        showToast('Verified successfully! Redirecting...', 'success');
                        setTimeout(() => {
                            window.location.replace(isAdmin ? 'admin.html' : 'dashboard.html');
                        }, 1500);
                    };

                    resetBtn();
                    return;
                }

                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.replace(isAdmin ? 'admin.html' : 'dashboard.html');
                }, 1500);

            } catch (err) {
                console.error(err);
                let msg = 'Invalid credentials. Please check again.';
                if (err.code === 'auth/invalid-credential') msg = `Incorrect password for ${typeof finalEmail !== 'undefined' ? finalEmail : 'account'}.`;
                else if (err.code === 'permission-denied') msg = 'Database permission denied.';
                else msg = err.message || msg;
                showToast(msg, 'error');
                resetBtn();
            }

            function resetBtn() {
                btn.disabled = false;
                btn.innerHTML = 'Login';
            }
        };

        window.forgotPassword = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) { showToast('Please enter your email, register no, or phone.', 'info'); return; }

            try {
                let finalEmail = email;
                if (!finalEmail.includes('@')) {
                    const studentsRef = collection(db, 'students');
                    let foundAccounts = [];

                    let q = query(studentsRef, where('registerNumber', '==', finalEmail));
                    let snap = await getDocs(q);

                    if (snap.empty) {
                        q = query(studentsRef, where('registerNumber', '==', finalEmail.toUpperCase()));
                        snap = await getDocs(q);
                    }
                    if (snap.empty) {
                        q = query(studentsRef, where('registerNumber', '==', finalEmail.toLowerCase()));
                        snap = await getDocs(q);
                    }

                    if (!snap.empty) {
                        snap.forEach(doc => foundAccounts.push(doc.data().email.trim()));
                    } else {
                        q = query(studentsRef, where('phone', '==', finalEmail));
                        snap = await getDocs(q);
                        if (!snap.empty) {
                            snap.forEach(doc => foundAccounts.push(doc.data().email.trim()));
                        } else {
                            showToast('Account not found with this Register/Mobile Number.', 'error');
                            return;
                        }
                    }

                    // Use the first resolved account for password reset
                    if (foundAccounts.length > 0) {
                        finalEmail = foundAccounts[0];
                    }
                }

                await sendPasswordResetEmail(auth, finalEmail);
                showToast(`Reset link sent to ${finalEmail}!`, 'success');
            } catch (err) {
                console.error(err);
                let msg = 'Error sending reset link.';
                if (err.code === 'auth/user-not-found') msg = 'Account not found.';
                else if (err.code === 'auth/invalid-email') msg = 'Invalid email address.';
                showToast(msg, 'error');
            }
        };

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            const icons = { success: 'check-circle', error: 'times-circle', info: 'info-circle' };
            toast.innerHTML = `<i class="fas fa-${icons[type]}" style="color:${type === 'success' ? '#10b981' : (type === 'error' ? '#ef4444' : '#6c63ff')}"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                toast.style.transition = '0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }
    </script>
</body>
