<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats - ExamPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="theme.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }
        /* Specific layout for chats page to make it full screen */
        body { 
            overflow: hidden; 
        } 
        .main {
            padding: 0; 
            display: flex;
            height: 100vh;
            background: var(--bg);
        }
        
        .chat-layout {
            display: flex;
            width: 100%;
            height: 100%;
            background: #111b21; /* WhatsApp dark theme base */
            color: #e9edef;
        }

        /* Left Panel - Chat List */
        .chat-list-panel {
            width: 380px;
            min-width: 380px;
            background: #111b21;
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }
        
        .chat-list-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #202c33;
        }
        
        .chat-list-header h2 { font-size: 20px; font-weight: 600; margin: 0; }
        
        .chat-search-bar {
            padding: 10px;
            background: #111b21;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .chat-search-bar input {
            width: 100%;
            background: #202c33;
            border: none;
            color: white;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 14px;
            outline: none;
        }

        .chat-filters {
            display: flex;
            gap: 10px;
            padding: 10px 15px;
            overflow-x: auto;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .chat-filters::-webkit-scrollbar { display: none; }
        
        .filter-pill {
            padding: 6px 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
            color: var(--text-muted);
        }
        .filter-pill.active { background: var(--primary); border-color: var(--primary); color: white; }

        .chat-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .chat-item:hover { background: #202c33; }
        
        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #3b4a54;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            margin-right: 15px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .chat-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
        .chat-info-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .chat-name { font-size: 16px; font-weight: 500; color: #e9edef; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { font-size: 12px; color: #8696a0; }
        
        .chat-info-bottom { display: flex; justify-content: space-between; align-items: center; }
        .chat-preview { font-size: 14px; color: #8696a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-right: 10px; }
        
        .role-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 600; margin-left: 8px; vertical-align: middle; }
        .role-student { background: rgba(108, 99, 255, 0.2); color: #8c82ff; }
        .role-admin { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
        .role-staff { background: rgba(6, 182, 212, 0.2); color: #22d3ee; }

        /* Right Panel - Conversation */
        .conversation-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #0b141a;
            position: relative;
        }
        
        .conversation-panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('dsu_logo.png') center/300px no-repeat;
            opacity: 0.03;
            pointer-events: none;
        }
        
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #8696a0;
        }
        .empty-state i { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
        .empty-state h3 { font-size: 24px; color: #e9edef; font-weight: 300; margin-bottom: 10px; }
        .empty-state p { font-size: 14px; max-width: 400px; line-height: 1.5; }
        
        /* Chat View */
        .chat-view-header {
            padding: 10px 20px;
            background: #202c33;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px 50px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1;
        }
        
        .message-bubble {
            max-width: 65%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            position: relative;
            line-height: 1.4;
            color: #e9edef;
            box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
        }
        .message-bubble.sent {
            background: #005c4b;
            align-self: flex-end;
            border-top-right-radius: 0;
        }
        .message-bubble.received {
            background: #202c33;
            align-self: flex-start;
            border-top-left-radius: 0;
        }
        
        .message-time {
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            float: right;
            margin-top: 4px;
            margin-left: 10px;
        }

        .chat-input-area {
            padding: 10px 20px;
            background: #202c33;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1;
        }
        
        .chat-input-area input {
            flex: 1;
            background: #2a3942;
            border: none;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        
        .icon-btn {
            background: none;
            border: none;
            color: #8696a0;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s;
        }
        .icon-btn:hover { color: #d1d7db; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 20, 26, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-content {
            background: #202c33;
            width: 90%;
            max-width: 400px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .modal-header {
            padding: 15px 20px;
            background: #111b21;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h3 { font-size: 18px; font-weight: 500; }
        .close-btn { background: none; border: none; color: #8696a0; font-size: 20px; cursor: pointer; }
        
        .modal-body { padding: 15px; display: flex; flex-direction: column; gap: 15px; max-height: 400px; }
        .modal-search {
            width: 100%;
            background: #2a3942;
            border: none;
            color: white;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        
        .search-results { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .search-result-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-result-item:hover { background: #2a3942; }

        /* Temporary back to dashboard button for layout integration */
        .back-btn { background: none; border: none; color: #e9edef; font-size: 20px; cursor: pointer; margin-right: 15px; }

        @media(max-width: 768px) {
            .chat-list-panel { width: 100%; }
            .conversation-panel { display: none; }
        }
    </style>
</head>
<body class="dark-mode"> <!-- Force dark mode for WhatsApp aesthetic -->

<div class="main" style="margin-left: 0;"> 
    <div class="chat-layout">
        <!-- Left Panel -->
        <div class="chat-list-panel">
            <div class="chat-list-header">
                <div style="display:flex; align-items:center;">
                    <button class="back-btn" onclick="window.history.back()" title="Go Back"><i class="fas fa-arrow-left"></i></button>
                    <h2>Chats</h2>
                </div>
                <div>
                    <button style="background:none; border:none; color:#aebac1; font-size: 20px; cursor:pointer;" onclick="alert('Creating new chat (Phase 3)')"><i class="fas fa-edit"></i></button>
                </div>
            </div>
            
            <div class="chat-search-bar">
                <input type="text" placeholder="Search or start new chat" id="searchInput">
            </div>
            
            <div class="chat-filters">
                <button class="filter-pill active" onclick="setFilter('all', this)">All</button>
                <button class="filter-pill" onclick="setFilter('friends', this)">Friends</button>
                <button class="filter-pill" onclick="setFilter('admin', this)">Admin</button>
                <button class="filter-pill" onclick="setFilter('staff', this)">Staff</button>
                <button class="filter-pill" onclick="setFilter('subjects', this)">Subjects</button>
            </div>
            
            <div class="chat-list" id="chatList">
                <div style="padding:20px;text-align:center;color:#8696a0;">Loading chats...</div>
            </div>
        </div>

        <!-- Right Panel (Placeholder for Phase 1) -->
        <div class="conversation-panel" id="conversationPanel">
            <div class="empty-state" id="emptyState">
                <i class="fab fa-whatsapp"></i>
                <h3>ExamPro Messages</h3>
                <p>Select a chat from the left panel to start messaging with students, staff, and admins securely.</p>
            </div>
            
            <div class="chat-view" id="chatView" style="display: none; height: 100%; flex-direction: column;">
                <div class="chat-view-header">
                    <div style="display:flex; align-items:center;">
                        <div class="chat-avatar" id="activeChatAvatar"><i class="fas fa-user"></i></div>
                        <div class="chat-info">
                            <div class="chat-name" id="activeChatName">Loading...</div>
                        </div>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessages">
                    <!-- Messages will appear here -->
                </div>
                <div class="chat-input-area">
                    <button class="icon-btn"><i class="fas fa-paperclip"></i></button>
                    <input type="text" id="messageInput" placeholder="Type a message" onkeypress="handleEnter(event)">
                    <button class="icon-btn" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- New Chat Modal -->
<div id="newChatModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3>New Chat</h3>
            <button class="close-btn" onclick="closeNewChatModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <input type="text" id="userSearchInput" class="modal-search" placeholder="Search by name..." oninput="searchUsers(this.value)">
            <div id="userSearchResults" class="search-results">
                <!-- User results will populate here -->
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, query, where, onSnapshot, orderBy, addDoc, serverTimestamp, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDKDT0kvwEm0cEdh_MpbTb8A9W3_xwAVxY",
        authDomain: "dsu-exam-system.firebaseapp.com",
        projectId: "dsu-exam-system",
        storageBucket: "dsu-exam-system.firebasestorage.app",
        messagingSenderId: "155083834622",
        appId: "1:155083834622:web:ff0a9780b88bad0b8811af",
        measurementId: "G-1TPT1BR6GD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentFilter = 'all';
    let allChats = [];
    let currentChatId = null;
    let messagesUnsubscribe = null;

    // --- Modal Logic ---
    window.openNewChatModal = function() {
        document.getElementById('newChatModal').style.display = 'flex';
        document.getElementById('userSearchInput').value = '';
        document.getElementById('userSearchResults').innerHTML = '';
        // Load initial users
        searchUsers('');
    }
    window.closeNewChatModal = function() {
        document.getElementById('newChatModal').style.display = 'none';
    }
    
    // Wire up the button in HTML
    document.querySelector('.fa-edit').parentElement.onclick = window.openNewChatModal;

    window.searchUsers = async function(searchQuery) {
        const resultsDiv = document.getElementById('userSearchResults');
        resultsDiv.innerHTML = '<div style="padding:10px;color:#8696a0;">Searching...</div>';
        
        try {
            const term = searchQuery.toLowerCase().trim();
            if(!term) {
                resultsDiv.innerHTML = '<div style="padding:10px;color:#8696a0;">Type a name to search.</div>';
                return;
            }

            // Fetch from admins, staff, and students collections
            // Since we can't do full text search easily, we do prefix search on 'name' or 'email'
            // But if they don't have indexes, we might have to fetch and filter.
            // For safety and performance in this demo, we'll fetch limited results using prefix query on name.
            
            // To do prefix search: where("name", ">=", term), where("name", "<=", term + '\uf8ff')
            // But let's just fetch all staff/admins (usually small) and students if term is provided
            
            const staffQ = query(collection(db, "staff"));
            const adminsQ = query(collection(db, "admins"));
            const studentsQ = query(collection(db, "students")); // For production, limit this!
            
            const [staffSnap, adminsSnap, studentsSnap] = await Promise.all([
                getDocs(staffQ),
                getDocs(adminsQ),
                getDocs(studentsQ)
            ]);
            
            resultsDiv.innerHTML = '';
            let count = 0;
            
            const processDoc = (docSnap, role) => {
                const userData = docSnap.data();
                if(docSnap.id === currentUser.uid) return;
                
                const name = userData.name || 'Unknown User';
                if(term && !name.toLowerCase().includes(term)) return;
                
                count++;
                if(count > 20) return;
                
                const roleBadge = role === 'admin' ? '<span class="role-badge role-admin" style="font-size:10px;background:#53bdeb;color:#0b141a;padding:2px 5px;border-radius:4px;margin-left:5px;">ADMIN</span>' : 
                                  role === 'staff' ? '<span class="role-badge role-staff" style="font-size:10px;background:#005c4b;color:white;padding:2px 5px;border-radius:4px;margin-left:5px;">STAFF</span>' : 
                                  '<span class="role-badge role-student" style="font-size:10px;background:#2a3942;color:#8696a0;padding:2px 5px;border-radius:4px;margin-left:5px;">STUDENT</span>';
                                  
                resultsDiv.innerHTML += `
                    <div class="search-result-item" onclick="startChatWith('${docSnap.id}', '${name.replace(/'/g, "\\'")}')">
                        <div class="chat-avatar" style="width:40px;height:40px;margin-right:10px;"><i class="fas fa-user"></i></div>
                        <div>
                            <div style="font-size:14px;color:white;">${name} ${roleBadge}</div>
                            <div style="font-size:12px;color:#8696a0;">${userData.regNo || userData.email || ''}</div>
                        </div>
                    </div>
                `;
            };
            
            adminsSnap.forEach(d => processDoc(d, 'admin'));
            staffSnap.forEach(d => processDoc(d, 'staff'));
            studentsSnap.forEach(d => processDoc(d, 'student'));
            
            if(count === 0) resultsDiv.innerHTML = '<div style="padding:10px;color:#8696a0;">No users found.</div>';
            
        } catch(error) {
            console.error("Search error", error);
            resultsDiv.innerHTML = '<div style="padding:10px;color:#f87171;">Error fetching users.</div>';
        }
    }

    window.startChatWith = async function(userId, userName) {
        // Check if chat already exists
        const existingChat = allChats.find(c => c.type === 'direct' && c.participants.includes(userId));
        
        if (existingChat) {
            closeNewChatModal();
            selectChat(existingChat.id, userName);
            return;
        }
        
        // Create new chat document
        try {
            const chatData = {
                type: 'direct',
                participants: [currentUser.uid, userId],
                createdBy: currentUser.uid,
                createdAt: serverTimestamp(),
                lastMessage: '',
                lastMessageAt: null,
                participantNames: {
                    [userId]: userName
                }
            };
            
            const docRef = await addDoc(collection(db, "chats"), chatData);
            closeNewChatModal();
            selectChat(docRef.id, userName);
        } catch (error) {
            console.error("Error creating chat", error);
            alert("Failed to start chat.");
        }
    }

    // --- Core Messaging Logic ---
    window.setFilter = function(filter, btnElem) {
        document.querySelectorAll('.filter-pill').forEach(btn => btn.classList.remove('active'));
        btnElem.classList.add('active');
        currentFilter = filter;
        renderChats();
    }

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUser = user;
            listenToChats();
        } else {
            window.location.href = 'login.html';
        }
    });

    function listenToChats() {
        const q = query(
            collection(db, "chats"),
            where("participants", "array-contains", currentUser.uid),
            orderBy("lastMessageAt", "desc")
        );

        onSnapshot(q, (snapshot) => {
            allChats = [];
            snapshot.forEach(doc => {
                allChats.push({ id: doc.id, ...doc.data() });
            });
            renderChats();
        }, (error) => {
            console.error("Error listening to chats:", error);
            document.getElementById('chatList').innerHTML = `<div style="padding:20px;text-align:center;color:#8696a0;">No chats yet. Start a new chat!</div>`;
        });
    }

    function renderChats() {
        const listElem = document.getElementById('chatList');
        listElem.innerHTML = '';
        
        let filteredChats = allChats;
        
        if(filteredChats.length === 0) {
            listElem.innerHTML = `<div style="padding:20px;text-align:center;color:#8696a0;">No chats found. Click the edit icon to start one!</div>`;
            return;
        }

        filteredChats.forEach(chat => {
            let displayName = chat.subject || "Direct Message";
            
            // Try to extract name of the other person if we saved it in Phase 3 or earlier
            if(chat.type === 'direct') {
                const otherUid = chat.participants.find(id => id !== currentUser.uid);
                if (chat.participantNames && chat.participantNames[otherUid]) {
                    displayName = chat.participantNames[otherUid];
                }
            }
            
            let roleBadgeHtml = "";
            let timeStr = chat.lastMessageAt ? new Date(chat.lastMessageAt.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
            const isActive = currentChatId === chat.id ? 'background: #2a3942;' : '';

            const itemHtml = `
                <div class="chat-item" style="${isActive}" onclick="selectChat('${chat.id}', '${displayName.replace(/'/g, "\\'")}')">
                    <div class="chat-avatar"><i class="fas fa-user"></i></div>
                    <div class="chat-info">
                        <div class="chat-info-top">
                            <div class="chat-name">${displayName} ${roleBadgeHtml}</div>
                            <div class="chat-time">${timeStr}</div>
                        </div>
                        <div class="chat-info-bottom">
                            <div class="chat-preview">${chat.lastMessage || 'Start messaging'}</div>
                        </div>
                    </div>
                </div>
            `;
            listElem.insertAdjacentHTML('beforeend', itemHtml);
        });
    }
    
    // Make selectChat global
    window.selectChat = function(chatId, chatName) {
        currentChatId = chatId;
        document.getElementById('emptyState').style.display = 'none';
        document.getElementById('chatView').style.display = 'flex';
        document.getElementById('activeChatName').textContent = chatName;
        
        // Unsubscribe from previous chat messages if any
        if (messagesUnsubscribe) messagesUnsubscribe();
        
        document.getElementById('chatMessages').innerHTML = '<div style="text-align:center;color:#8696a0;padding:20px;">Loading messages...</div>';
        
        // Listen to messages
        const q = query(
            collection(db, "chats", chatId, "messages"),
            orderBy("sentAt", "asc")
        );
        
        messagesUnsubscribe = onSnapshot(q, (snapshot) => {
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML = '';
            
            if(snapshot.empty) {
                messagesDiv.innerHTML = '<div style="text-align:center;color:#8696a0;padding:20px;">Say hi!</div>';
                return;
            }
            
            snapshot.forEach(docSnap => {
                const msg = docSnap.data();
                const isMine = msg.senderId === currentUser.uid;
                const bubbleClass = isMine ? 'sent' : 'received';
                const timeStr = msg.sentAt ? new Date(msg.sentAt.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '';
                
                messagesDiv.innerHTML += `
                    <div class="message-bubble ${bubbleClass}">
                        ${!isMine && chatName === 'Group' ? `<div style="font-size:12px;color:#53bdeb;margin-bottom:3px;">${msg.senderName || 'Unknown'}</div>` : ''}
                        ${msg.text}
                        <span class="message-time">${timeStr}</span>
                    </div>
                `;
            });
            
            // Auto scroll
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
        
        // Highlight active chat in list
        renderChats(); 
    }
    
    window.handleEnter = function(e) {
        if(e.key === 'Enter') sendMessage();
    }
    
    window.sendMessage = async function() {
        if(!currentChatId) return;
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if(!text) return;
        
        input.value = ''; // Optimistic clear
        
        try {
            // Write to messages subcollection
            await addDoc(collection(db, "chats", currentChatId, "messages"), {
                senderId: currentUser.uid,
                text: text,
                sentAt: serverTimestamp(),
                readBy: [currentUser.uid]
            });
            
            // Update parent chat
            await updateDoc(doc(db, "chats", currentChatId), {
                lastMessage: text,
                lastMessageAt: serverTimestamp()
            });
            
        } catch(error) {
            console.error("Error sending message", error);
            alert("Failed to send message.");
        }
    }
</script>
</body>
</html>
